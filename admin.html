(function(){
  var DB_NAME="otrip-cache",READ_TIMEOUT=8000,COLD_READ_TIMEOUT=30000,WRITE_TIMEOUT=10000,PROBE_EVERY=15000,SYNC_DELAY=1500,SYNC_EVERY=600000;   // sans copie locale on attend plus longtemps : mieux vaut un réseau lent qu'une application vide
  var dbp=null;
  function db(){
    if(dbp)return dbp;
    dbp=new Promise(function(res){
      try{
        var rq=indexedDB.open(DB_NAME,1);
        rq.onupgradeneeded=function(){var d=rq.result;d.createObjectStore("kv");d.createObjectStore("meta");};

      if(!d)return undefined;

        }catch(e){res(undefined);}
      });
    });
  }
  var idbGet=function(store,key){return idb(store,"readonly",function(s){return s.get(key);});};
  var idbPut=function(store,key,val){return idb(store,"readwrite",function(s){return s.put(val,key);});};
  var idbDel=function(store,key){return idb(store,"readwrite",function(s){return s.delete(key);});};
  var idbKeys=function(store){return idb(store,"readonly",function(s){return s.getAllKeys();});};

  function withTimeout(p,ms){
    return new Promise(function(res,rej){
      var t=setTimeout(function(){rej(new Error("timeout"));},ms);
      Promise.resolve(p).then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});
    });
  }
  /* Une erreur de réseau n'a pas de code Postgres ; une erreur du serveur (droits, table…) en a un : elle n'est pas « hors ligne ». */
  function isNetErr(e){
    if(!e)return false;
    if(e.name==="TypeError"||e.name==="AbortError")return true;
    var m=String(e.message||e);
    if(/fetch|network|timeout|timed out|offline|load failed|aborted|internet/i.test(m))return true;
    return !e.code&&!e.status;
  }

  window.__rtMakeBridge=function(SB){
    var state={offline:false,lastSync:null,reason:"",blocked:0};
    var probeTimer=null,syncTimer=null,syncing=false,seen={};   // seen : clés lues ou écrites avec succès pendant cette session

      get:async function(key,shared){

        if(!SB)return null;
        await ready;

        try{
          var v=value;try{v=JSON.parse(value);}catch(e){}
          var r=await withTimeout(SB.from("kv").upsert({key:key,value:v}),WRITE_TIMEOUT);
          if(r.error){if(isNetErr(r.error)){setOffline(true,String(r.error.message||""));block(key);}return null;}
          idbPut("kv",key,v);touchSync();seen[key]=1;setOffline(false);
          return {key:key,value:value,shared:!!shared};
        }catch(e){
          if(isNetErr(e)){setOffline(true,String(e&&e.message||e));block(key);}
          return null;
        }
      },
      delete:async function(key,shared){
        if(!SB)return null;
        await ready;
        if(state.offline||(typeof navigator!=="undefined"&&navigator.onLine===false)){block(key);return null;}
        try{
          var r=await withTimeout(SB.from("kv").delete().eq("key",key),WRITE_TIMEOUT);
          if(r.error){if(isNetErr(r.error)){setOffline(true,String(r.error.message||""));block(key);}return null;}
          idbDel("kv",key);touchSync();delete seen[key];
          return {key:key,deleted:true,shared:!!shared};
        }catch(e){
          if(isNetErr(e)){setOffline(true,String(e&&e.message||e));block(key);}
          return null;
        }
      },
      list:async function(prefix,shared){
        if(!SB)return null;
        try{
          var q=SB.from("kv").select("key");
          if(prefix)q=q.like("key",prefix+"%");
          var r=await withTimeout(q,READ_TIMEOUT);
          if(r.error||!r.data){if(r&&r.error&&isNetErr(r.error))setOffline(true,String(r.error.message||""));return null;}
          return {keys:r.data.map(function(row){return row.key;}),prefix:prefix,shared:!!shared};
        }catch(e){if(isNetErr(e))setOffline(true,String(e&&e.message||e));return null;}
      }
    };
    /* Valeur décodée d'une clé (pour la page d'entrée) ; null si absente. */
    async function getValue(key){var r=await readRaw(key);return r.found?r.value:null;}
    if(typeof window!=="undefined"){
      window.addEventListener("offline",function(){setOffline(true,"offline");});
      window.addEventListener("online",function(){probe();});
    }
    if(typeof document!=="undefined"){
      document.addEventListener("visibilitychange",function(){
        if(document.visibilityState==="visible"&&!state.offline&&(!state.lastFullSync||Date.now()-state.lastFullSync>SYNC_EVERY))scheduleSync();
      });
    }
    var api={storage:storage,getValue:getValue,probe:probe,syncTrip:syncTrip,state:state,snapshot:snapshot};
    window.__rtBridge=api;
    return api;
  };
})();
