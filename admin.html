<script>
window.__SB_URL__='https://eywzawdwblnnfxtfwqsu.supabase.co';
window.__SB_KEY__='sb_publishable_F5G7FrnOnMW3xp82ox4c8w_MrMn3IaT';
window.supabase = window.supabase ? window.supabase.createClient(window.__SB_URL__, window.__SB_KEY__) : null;
window.storage = {
  get: async function(key, shared){
    if(!window.supabase) return null;
    try{
      var r = await window.supabase.from("kv").select("value").eq("key", key).maybeSingle();
      if(r.error || !r.data) return null;
      var v = r.data.value;
      if(typeof v !== "string") v = JSON.stringify(v);
      return {key: key, value: v, shared: !!shared};
    }catch(e){ return null; }
  },
  set: async function(key, value, shared){
    if(!window.supabase) return null;
    try{
      var v = value;
      try{ v = JSON.parse(value); }catch(e){}
      var r = await window.supabase.from("kv").upsert({key: key, value: v});
      if(r.error) return null;
      return {key: key, value: value, shared: !!shared};
    }catch(e){ return null; }
  },
  delete: async function(key, shared){
    if(!window.supabase) return null;
    try{
      var r = await window.supabase.from("kv").delete().eq("key", key);
      if(r.error) return null;
      return {key: key, deleted: true, shared: !!shared};
    }catch(e){ return null; }
  },
  list: async function(prefix, shared){
    if(!window.supabase) return null;
    try{
      var q = window.supabase.from("kv").select("key");
      if(prefix) q = q.like("key", prefix+"%");
      var r = await q;
      if(r.error || !r.data) return null;
      return {keys: r.data.map(function(row){return row.key;}), prefix: prefix, shared: !!shared};
    }catch(e){ return null; }
  }
};
