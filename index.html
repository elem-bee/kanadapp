  color:#eafcff;margin:6px 0 22px;line-height:1.15;
  text-shadow:0 0 6px #5fe0ff,0 0 16px #29c5ff,0 0 34px #1690c7,0 0 2px #ffffff;}
.grid{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-bottom:8px}
.tile{border:0;background:transparent;padding:0;cursor:pointer;width:96px;display:flex;flex-direction:column;align-items:center;gap:8px}
.tile:focus-visible .tileimg{outline:2.5px solid var(--gold);outline-offset:3px}
.tileimg{width:76px;height:76px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#fff;display:flex;align-items:center;justify-content:center}
.tileimg img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.tilelabel{color:#fbf3e4;font-size:12.5px;font-weight:600;line-height:1.3}
.tile--admin .tileimg{background:#2a2620;border-color:#5c5548}
.tile--admin svg{width:34px;height:34px}
.hint{color:#cdd7cd;font-size:13px;text-align:center;margin-top:6px}
.gate{margin-top:18px}
.gatecard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:18px}
.gatename{font-family:var(--serif);font-weight:600;font-size:18px;color:#fbf3e4;margin-bottom:10px}
.row{display:flex;gap:8px}
.in{flex:1;min-width:0;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:12px 14px;font-family:var(--sans);font-size:15px}
.in::placeholder{color:#9fb0a3}
.in:focus{outline:2px solid var(--gold)}
.btn{flex:0 0 auto;border:0;background:var(--maple);color:#fff;font-weight:700;font-family:var(--sans);font-size:15px;padding:12px 18px;border-radius:12px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.back{margin-top:12px;background:transparent;border:0;color:#cdd7cd;font-size:12.5px;cursor:pointer;text-decoration:underline}
.err{color:#f0b8b0;font-size:13px;margin-top:12px;min-height:18px}
.status{color:#cdd7cd;font-size:13px;margin-top:12px}
.loading{color:#cdd7cd;font-size:13.5px}
</style>
</head>

  function nsKey(tripId, base){ return tripId ? (tripId + "::" + base) : base; }

  async function kvGet(key){
    if(!sb) return null;
    try{
      var r = await sb.from("kv").select("value").eq("key", key).maybeSingle();
      if(r.error) return null;
      return r.data ? r.data.value : null;
    }catch(e){ return null; }
  }

  async function sha256hex(str){
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
  }

  async function getAuthHashes(tripId){
    var v = await kvGet(nsKey(tripId, "auth-hashes"));
    if(v && v.admin && v.user) return v;
    if(tripId === "") return {admin: LEGACY_ADMIN_HASH, user: LEGACY_USER_HASH};
    return null;
  }

  function rememberRole(role, tripId){
    try{
      localStorage.setItem("rt_role", role);
      localStorage.setItem("rt_role::" + (tripId || ""), role);
    }catch(e){}
  }

  function showStatus(msg){
    document.getElementById("picker").style.display = "none";
    document.getElementById("err").style.display = "none";
    var st = document.getElementById("status");
    st.style.display = "block";
    st.textContent = msg;
  }

  async function redirectToRoadbook(tripId){
    showStatus("Ouverture du carnet de route…");
    var url = await kvGet(nsKey(tripId, "roadbook-url"));

      window.location.href = String(url).trim();
    } else {
      showStatus("Le lien de ce carnet n'est pas encore configuré. Demande à l'organisateur de le renseigner dans Admin.");
    }
  }

  async function redirectToAdmin(){
    showStatus("Ouverture de l'administration…");
    var url = await kvGet("admin-url");
    if(url && String(url).trim()){
      window.location.href = String(url).trim();

  function openGate(tile){
    var picker = document.getElementById("picker");
    var name = tile.isAdmin ? "Administration" : tile.name;
    picker.innerHTML =
      '<div class="gate"><div class="gatecard">' +
        '<div class="gatename">' + escapeHtml(name) + '</div>' +
        '<div class="row"><input class="in" type="password" id="pw" placeholder="Mot de passe" autocomplete="off"/>' +
        '<button class="btn" id="go">Entrer</button></div>' +
      '</div>' +
      '<button class="back" id="backBtn">← Retour</button></div>';
    document.getElementById("err").textContent = "";
    document.getElementById("pw").focus();
    document.getElementById("backBtn").addEventListener("click", renderPicker);
    document.getElementById("go").addEventListener("click", function(){ tryUnlock(tile); });
    document.getElementById("pw").addEventListener("keydown", function(e){ if(e.key==="Enter") tryUnlock(tile); });
  }

  async function tryUnlock(tile){
    var pw = document.getElementById("pw").value;
    var errEl = document.getElementById("err");
    var goBtn = document.getElementById("go");
    if(!pw) return;
    goBtn.disabled = true; errEl.textContent = "";
    try{
      var h = await sha256hex(SALT + pw);
      if(tile.isAdmin){
        if(h === GOD_HASH){ rememberRole("admin","__admin__"); await redirectToAdmin(); }
        else { errEl.textContent = "Mot de passe incorrect."; }
      } else {
        var hashes = await getAuthHashes(tile.id);
        if(hashes && (h === hashes.admin || h === hashes.user)){ rememberRole(h === hashes.admin ? "admin" : "user", tile.id); await redirectToRoadbook(tile.id); }
        else { errEl.textContent = "Mot de passe incorrect."; }
      }
    } catch(e){
      errEl.textContent = "Une erreur est survenue.";
    } finally {
      goBtn.disabled = false;
    }
  }

  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }

  var TILES = [];

  function tileHtml(tile, i){
    var img = tile.isAdmin
      ? '<div class="tileimg">' + ADMIN_ICON_SVG + '</div>'
      : (tile.logo ? '<div class="tileimg"><img src="'+tile.logo+'" alt=""/></div>' : '<div class="tileimg">'+DEFAULT_ICON_SVG+'</div>');
    return '<button type="button" class="tile'+(tile.isAdmin?' tile--admin':'')+'" data-i="'+i+'" aria-label="'+escapeHtml(tile.isAdmin?"Administration":tile.name)+'">' +
      img + '<span class="tilelabel">'+escapeHtml(tile.isAdmin?"Admin":tile.name)+'</span></button>';
  }

  function renderPicker(){
    var picker = document.getElementById("picker");
    document.getElementById("err").textContent = "";
    document.getElementById("status").style.display = "none";
    picker.style.display = "block";
    picker.innerHTML = '<div class="grid">' + TILES.map(tileHtml).join("") + '</div>';
    Array.prototype.forEach.call(picker.querySelectorAll(".tile"), function(btn){
      btn.addEventListener("click", function(){ openGate(TILES[parseInt(btn.getAttribute("data-i"),10)]); });
    });
  }

  async function kvGetMany(keys){
    var out = {};
    if(!sb || !keys.length) return out;
    try{
      var r = await sb.from("kv").select("key,value").in("key", keys);
      if(r.error || !r.data) return out;
      r.data.forEach(function(row){ out[row.key] = row.value; });
    }catch(e){}
    return out;
  }

  async function init(){
    var base = await kvGetMany(["roadtrip-canada-tripmeta-v1","roadtrip-canada-logo-v1","trips-index"]);
    var defaultName = base["roadtrip-canada-tripmeta-v1"];
    var defaultLogo = base["roadtrip-canada-logo-v1"];
    var idx = base["trips-index"];

    TILES.push({id:"", name:(defaultName && defaultName.name) ? defaultName.name : "Road Trip Canada", logo: defaultLogo || ""});

    if(idx && idx.length){
      var logoKeys = idx.map(function(t){ return nsKey(t.id, "roadtrip-canada-logo-v1"); });
      var logos = await kvGetMany(logoKeys);
      idx.forEach(function(t){
        TILES.push({id:t.id, name:t.name, logo: logos[nsKey(t.id,"roadtrip-canada-logo-v1")] || ""});
      });
    }
    TILES.push({isAdmin:true});

    renderPicker();
  }

  init();
})();
</script>
</body>
</html>
