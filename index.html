<script>
(function(){
  var sb = (window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.SUPABASE_ANON_KEY.indexOf("VOTRE_CLE")<0 && window.supabase)
    ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY) : null;
  if(!sb){ console.warn("Supabase non configuré : donnees non partagees."); }
  async function kvGet(k){ if(!sb) return null; try{ var r=await sb.from("kv").select("value").eq("key",k).maybeSingle(); if(r.error) return null; return r.data ? r.data.value : null; }catch(e){ return null; } }
  async function kvSet(k,v){ if(!sb) return; try{ await sb.from("kv").upsert({key:k, value:v, updated_at:new Date().toISOString()}); }catch(e){} }
  async function kvDel(k){ if(!sb) return; try{ await sb.from("kv").delete().eq("key",k); }catch(e){} }
  window.storage = {
    get:    async function(key){ var v=await kvGet(key); return v==null ? null : {key:key, value:JSON.stringify(v)}; },
    set:    async function(key,value){ await kvSet(key, JSON.parse(value)); return {key:key, value:value}; },
    "delete": async function(key){ await kvDel(key); return {key:key, deleted:true}; },
    list:   async function(){ return {keys:[]}; }
  };
  window.SB_HEALTH = async function(){ if(!sb) return false; try{ var r=await sb.from("kv").select("key").limit(1); return !r.error; }catch(e){ return false; } };
})();

:root{--pine:#1c3a2e;--pine-2:#254a3a;--pine-soft:#e7ede6;--maple:#a83a2c;--maple-deep:#7c2a20;--maple-soft:#f4e2dd;--amber:#c9862b;--gold:#e2b45c;--amber-soft:#f5ead2;--paper:#f4efe3;--card:#fbf7ee;--ink:#2a2620;--ink-soft:#6d6456;--line:rgba(28,58,46,.14);--serif:"Fraunces",Georgia,serif;--sans:"Work Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
*{box-sizing:border-box}
.rt-root{font-family:var(--sans);color:var(--ink);background:var(--paper);min-height:100%;-webkit-font-smoothing:antialiased;line-height:1.5}
.rt-shell{max-width:640px;margin:0 auto;background:var(--paper);min-height:100vh;box-shadow:0 0 60px rgba(28,58,46,.06)}
.rt-topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--pine)}
.rt-topbar__t{font-family:var(--serif);font-weight:600;font-size:16px;color:#fbf3e4}
.rt-status{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle;box-shadow:0 0 0 2px rgba(255,255,255,.2)}
.rt-orignal-btn{border:0;background:transparent;padding:0;cursor:pointer;line-height:0}
.rt-orignal-btn img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#fff}
.rt-dollar{font-family:var(--serif);font-weight:700;font-size:20px;color:#fbf3e4;line-height:1}
.rt-hero{position:relative;background:var(--pine);color:var(--paper);padding:20px 22px 28px;overflow:hidden}
.rt-hero__kicker{font-size:11.5px;letter-spacing:.14em;font-weight:600;color:var(--gold)}
.rt-hero__title{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,8vw,2.7rem);line-height:1.02;margin:8px 0 2px;color:#fbf3e4}
.rt-hero__sub{font-size:14px;color:#cdd7cd;margin-top:6px}
.rt-hero__scene{width:100%;height:auto;margin:14px 0 4px;display:block}
.rt-count{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.rt-count__num{font-family:var(--serif);font-weight:600;font-size:32px;color:var(--gold);line-height:1}
.rt-count__lbl{font-size:13px;color:#c6d0c6}
.rt-reveal{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rt-nav{position:sticky;top:56px;z-index:20;display:flex;flex-wrap:wrap;gap:4px;background:var(--paper);padding:8px;border-bottom:1px solid var(--line)}
.rt-nav__btn{flex:1 1 70px;border:0;background:transparent;cursor:pointer;font-family:var(--sans);font-size:12.5px;font-weight:700;letter-spacing:.03em;color:var(--ink-soft);padding:10px 4px;border-radius:11px;transition:background .18s,color .18s}
.rt-nav__btn[aria-selected="true"]{background:var(--pine);color:#fbf3e4}
.rt-nav__btn:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px}
.rt-body{padding:18px 16px 36px}
.rt-note{font-size:12.5px;color:var(--ink-soft);background:var(--amber-soft);border-left:3px solid var(--amber);padding:9px 12px;border-radius:0 8px 8px 0;margin-bottom:16px}
.rt-mini{font-size:12px;color:var(--ink-soft);margin:6px 0 0;line-height:1.4}
.rt-badge{display:inline-block;font-size:11px;font-weight:700;background:var(--maple-soft);color:var(--maple-deep);padding:2px 8px;border-radius:999px}
.rt-leg{margin:20px 0 10px}.rt-leg:first-child{margin-top:2px}
.rt-leg__name{font-family:var(--serif);font-weight:600;font-size:17px;color:var(--pine);letter-spacing:.02em}
.rt-leg__meta{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
.rt-plan-day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px;margin-bottom:11px}
.rt-expand{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--pine);font-size:16px;font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rt-expand:hover{background:var(--pine-soft)}
.rt-plan-day__hdtext{flex:1;min-width:0}
.rt-item--compact .rt-item__t{font-size:13.5px}
.rt-item--full{padding:12px 0}
.rt-item--full .rt-item__main{width:100%}
.rt-item--full .rt-item__links{width:100%}
.rt-item__n--empty{font-style:italic;color:var(--ink-soft);opacity:.7}
.rt-modal--full{align-items:stretch;justify-content:stretch;padding:0}
.rt-modal__box--full{width:100%;max-width:none;height:100%;max-height:none;border-radius:0}
.rt-modal__body--full{padding:6px 24px 28px;max-width:960px;margin:0 auto;width:100%}
@media(min-width:900px){.rt-modal__body--full{max-width:1920px;padding:6px 48px 34px}}
.rt-plan-day__hd{display:flex;align-items:flex-start;gap:9px;margin-bottom:8px}
.rt-plan-day__date{font-size:20px;font-weight:700;color:var(--ink-soft)}.rt-plan-day__date b{color:var(--pine);text-transform:capitalize}
.rt-plan-day__ttl{font-family:var(--serif);font-weight:600;font-size:16px;color:var(--ink);margin-top:1px}
.rt-slot{display:flex;gap:12px;padding:7px 0;border-top:1px solid var(--line)}.rt-slot:first-of-type{border-top:0}
.rt-slot__t{flex:0 0 82px;font-size:12.5px;font-weight:700;padding-top:1px}
.rt-slot__c{flex:1;min-width:0;font-size:14px;color:var(--ink);line-height:1.42}.rt-slot__c--free{color:var(--ink-soft);font-style:italic}
.rt-slot--am .rt-slot__t{color:var(--amber)}.rt-slot--pm .rt-slot__t{color:var(--pine)}.rt-slot--ev .rt-slot__t{color:var(--maple)}.rt-slot--day .rt-slot__t{color:var(--pine)}
.rt-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.rt-tag--wknd{background:var(--amber-soft);color:var(--maple-deep)}.rt-tag--travel{background:var(--pine-soft);color:var(--pine)}.rt-tag--maxime{background:var(--maple-soft);color:var(--maple-deep)}
.rt-subnav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.rt-subnav__btn{border:1px solid var(--line);background:var(--card);cursor:pointer;font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--ink-soft);padding:7px 11px;border-radius:999px}
.rt-subnav__btn[aria-selected="true"]{background:var(--pine);color:#fbf3e4;border-color:var(--pine)}
.rt-fgroup{margin-bottom:18px}.rt-fgroup__h{font-family:var(--serif);font-weight:600;font-size:17px;color:var(--pine);margin:0 0 9px}
.rt-tkt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:9px;position:relative;overflow:hidden}
.rt-tkt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--maple)}
.rt-tkt__top{font-size:12.5px;color:var(--ink-soft);margin-bottom:7px}.rt-tkt__no{font-weight:700;color:var(--pine);letter-spacing:.04em}

.rt-pie__val{color:var(--ink-soft);font-weight:600;white-space:nowrap}
.rt-hist{margin-top:6px}
.rt-hist__max{font-size:11px;color:var(--ink-soft);text-align:right;margin-top:2px}
.rt-rate{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--ink)}
.rt-export{padding:14px 16px 0;text-align:center}
.rt-export__btn{border:1px solid var(--line);background:var(--card);color:var(--pine);font-family:var(--sans);font-weight:600;font-size:13px;padding:10px 18px;border-radius:11px;cursor:pointer}
.rt-export__btn:hover{background:var(--pine-soft)}
@media(min-width:820px){.rt-shell{max-width:1560px}.rt-body{padding:24px 34px 50px}.rt-hero{padding:26px 34px 32px}}
.rt-grid{display:grid;grid-template-columns:1fr;gap:11px;align-items:start}
.rt-grid>*{margin-bottom:0}
@media(min-width:760px){.rt-grid{grid-template-columns:1fr 1fr}.rt-map{height:420px}}
@media(min-width:1180px){.rt-grid{grid-template-columns:1fr 1fr 1fr}}
@media(min-width:1180px){.rt-map{height:600px}}
.rt-pdfbtn-icon{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fbf3e4;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.rt-pdfbtn-icon:hover{background:rgba(255,255,255,.12)}
.rt-pdfbtn-icon:disabled{opacity:.5;cursor:default}
.rt-logorow{display:flex;align-items:center;gap:14px}
.rt-logorow__img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#fff}
.rt-logorow__act{display:flex;gap:8px}
.rt-logorow__btn{display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--pine);font-family:var(--sans);font-weight:600;font-size:12.5px;padding:7px 12px;border-radius:9px;cursor:pointer}
.rt-logorow__btn:hover{background:var(--pine-soft)}
.rt-logorow__btn--del{color:var(--maple-deep);border-color:#e0c0b8}
.rt-map-layout{display:block}
.rt-docs-layout{display:block}
@media(min-width:1000px){
  .rt-map-layout{display:flex;gap:22px;align-items:flex-start}
  .rt-map-col{flex:0 0 66%;min-width:0}
  .rt-poi-col{flex:1;min-width:0}
  .rt-docs-layout{display:grid;grid-template-columns:1fr 2fr;gap:22px;align-items:start}
}
@media (prefers-reduced-motion:reduce){.rt-reveal,.rt-typing span{animation:none}}
