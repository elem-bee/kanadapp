<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Compagnon Road Trip Canada</title>
<style>
:root{
  --pine:#1c3a2e; --gold:#e2b45c; --maple:#a83a2c; --paper:#f4efe3;
  --serif:"Fraunces",Georgia,serif; --sans:"Work Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--pine);font-family:var(--sans)}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:360px;width:100%;text-align:center}
.logobtn{border:0;background:transparent;padding:0;cursor:pointer;display:block;margin:0 auto 14px;border-radius:50%}
.logobtn:focus-visible{outline:2.5px solid var(--gold);outline-offset:4px}
.logobtn img{width:110px;height:110px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#fff;display:block}
.hint{color:#cdd7cd;font-size:13.5px;text-align:center}
.kicker{font-size:11.5px;letter-spacing:.16em;font-weight:600;color:var(--gold);text-transform:uppercase}
.title{font-family:var(--serif);font-weight:600;font-size:clamp(1.6rem,7vw,2.2rem);color:#fbf3e4;margin:8px 0 4px;line-height:1.05}
.sub{font-size:14px;color:#cdd7cd;margin-bottom:22px}
.row{display:flex;gap:8px}
.in{flex:1;min-width:0;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:12px 14px;font-family:var(--sans);font-size:15px}
.in::placeholder{color:#9fb0a3}
.in:focus{outline:2px solid var(--gold)}
.btn{flex:0 0 auto;border:0;background:var(--maple);color:#fff;font-weight:700;font-family:var(--sans);font-size:15px;padding:12px 18px;border-radius:12px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.err{color:#f0b8b0;font-size:13px;margin-top:12px;min-height:18px}
.status{color:#cdd7cd;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="card">
  <button type="button" class="logobtn" id="logoBtn" aria-label="Continuer">
    <img id="logoImg" src="" alt=""/>
  </button>
  <div id="hint" class="hint">Touchez le logo pour continuer</div>
  <div id="gate" style="display:none">
    <div class="kicker">CARNET DE ROUTE · PRIVÉ</div>
    <div class="title">Compagnon Road Trip Canada</div>
    <div class="sub">Entre le mot de passe partagé par l'organisateur.</div>
    <div class="row">
      <input class="in" type="password" id="pw" placeholder="Mot de passe" autocomplete="off"/>
      <button class="btn" id="go">Entrer</button>
    </div>
    <div class="err" id="err"></div>
  </div>
  <div class="status" id="status" style="display:none"></div>
</div></div>

<script>
  window.SUPABASE_URL      = "https://eywzawdwblnnfxtfwqsu.supabase.co";
  window.SUPABASE_ANON_KEY = "sb_publishable_F5G7FrnOnMW3xp82ox4c8w_MrMn3IaT";
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  var SALT="4604f021254342ca";
  var PASS_HASH="5fd2f07360cb147cb05e91882ca8294419086fa7652c5f2725b7da75aeeb6ed3";
  var USER_HASH="813dbd34e3a4437453a8eca44b25580f087ec3faae01650fa87e5d22615aea5a";

  var sb = (window.supabase && window.SUPABASE_URL) ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY) : null;

  async function kvGet(key){
    if(!sb) return null;
    try{
      var r = await sb.from("kv").select("value").eq("key", key).maybeSingle();
      if(r.error) return null;
      return r.data ? r.data.value : null;
    }catch(e){ return null; }
  }

  async function sha256hex(str){
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
  }

  function getStoredRole(){ try{ return localStorage.getItem("rt_role"); }catch(e){ return null; } }
  function setStoredRole(r){ try{ if(r) localStorage.setItem("rt_role", r); }catch(e){} }

  function showStatus(msg){
    document.getElementById("card").querySelectorAll(".logobtn,.hint,#gate").forEach(function(el){ el.style.display="none"; });
    var st = document.getElementById("status");
    st.style.display = "block";
    st.textContent = msg;
  }

  async function goToRoadbook(){
    showStatus("Ouverture du carnet de route…");
    var url = await kvGet("roadbook-url");
    if(url && String(url).trim()){
      window.location.href = String(url).trim();
    } else {
      showStatus("Le lien du carnet n'est pas encore configuré. Demande à l'organisateur de le renseigner dans Réglages ▸ Voyage.");
    }
  }

  async function loadLogo(){
    var v = await kvGet("roadtrip-canada-logo-v1");
    if(v){ document.getElementById("logoImg").src = v; }
  }

  function reveal(){
    document.getElementById("hint").style.display = "none";
    document.getElementById("gate").style.display = "block";
    document.getElementById("pw").focus();
  }

  async function tryUnlock(){
    var pw = document.getElementById("pw").value;
    var errEl = document.getElementById("err");
    var goBtn = document.getElementById("go");
    if(!pw) return;
    goBtn.disabled = true; errEl.textContent = "";
    try{
      var h = await sha256hex(SALT + pw);
      if(h === PASS_HASH || h === USER_HASH){
        setStoredRole(h === PASS_HASH ? "admin" : "user");
        await goToRoadbook();
      } else {
        errEl.textContent = "Mot de passe incorrect.";
      }
    } catch(e){
      errEl.textContent = "Une erreur est survenue.";
    } finally {
      goBtn.disabled = false;
    }
  }

  document.getElementById("logoBtn").addEventListener("click", reveal);
  document.getElementById("go").addEventListener("click", tryUnlock);
  document.getElementById("pw").addEventListener("keydown", function(e){ if(e.key==="Enter") tryUnlock(); });

  loadLogo();
  if(getStoredRole()){
    goToRoadbook();
  }
})();
</script>
</body>
</html>
