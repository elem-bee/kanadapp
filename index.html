<style>
:root{
  --pine:#1c3a2e; --gold:#e2b45c; --maple:#a83a2c; --paper:#f4efe3;
  --serif:"Fraunces",Georgia,serif; --sans:"Work Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050505;font-family:var(--sans)}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:420px;width:100%;text-align:center}
.kicker{font-size:11.5px;letter-spacing:.16em;font-weight:600;color:var(--gold);text-transform:uppercase}
.herologo{max-width:180px;width:70%;height:auto;display:block;margin:0 auto 6px}
.title{font-family:"Poppins",var(--sans);font-weight:800;font-size:clamp(1.5rem,6.2vw,2.15rem);letter-spacing:.01em;
  color:#eafcff;margin:6px 0 22px;line-height:1.15;
  text-shadow:0 0 6px #5fe0ff,0 0 16px #29c5ff,0 0 34px #1690c7,0 0 2px #ffffff;}
.grid{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-bottom:8px}
.tile{border:0;background:transparent;padding:0;cursor:pointer;width:96px;display:flex;flex-direction:column;align-items:center;gap:8px}
.tile:focus-visible .tileimg{outline:2.5px solid var(--gold);outline-offset:3px}
.tileimg{width:76px;height:76px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#fff;display:flex;align-items:center;justify-content:center}
.tileimg img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.tilelabel{color:#fbf3e4;font-size:12.5px;font-weight:600;line-height:1.3}
.tile--admin .tileimg{background:#2a2620;border-color:#5c5548}
.tile--admin svg{width:34px;height:34px}
.hint{color:#cdd7cd;font-size:13px;text-align:center;margin-top:6px}
.gate{margin-top:18px}
.gatecard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:18px}
.gatename{font-family:var(--serif);font-weight:600;font-size:18px;color:#fbf3e4;margin-bottom:10px}
.row{display:flex;gap:8px}
.in{flex:1;min-width:0;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:12px 14px;font-family:var(--sans);font-size:15px}
.in::placeholder{color:#9fb0a3}
.in:focus{outline:2px solid var(--gold)}
.btn{flex:0 0 auto;border:0;background:var(--maple);color:#fff;font-weight:700;font-family:var(--sans);font-size:15px;padding:12px 18px;border-radius:12px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.back{margin-top:12px;background:transparent;border:0;color:#cdd7cd;font-size:12.5px;cursor:pointer;text-decoration:underline}
.err{color:#f0b8b0;font-size:13px;margin-top:12px;min-height:18px}
.status{color:#cdd7cd;font-size:13px;margin-top:12px}
.loading{color:#cdd7cd;font-size:13.5px}
</style>

<!-- PWA:BRIDGE --><script>/* Pont de stockage Supabase avec copie locale (IndexedDB) : lecture hors ligne, écriture refusée hors ligne.
   Inséré tel quel dans chaque page. Définit window.__rtMakeBridge(client) -> {storage, getValue, probe, state}.
   Événements : « rt-net » (état du réseau) et « rt-write-blocked » (écriture refusée faute de réseau). */
(function(){
  var DB_NAME="otrip-cache",READ_TIMEOUT=8000,COLD_READ_TIMEOUT=30000,WRITE_TIMEOUT=10000,PROBE_EVERY=15000,SYNC_DELAY=1500,SYNC_EVERY=600000;   // sans copie locale on attend plus longtemps : mieux vaut un réseau lent qu'une application vide
  var dbp=null;
  function db(){
    if(dbp)return dbp;
    dbp=new Promise(function(res){
      try{
        var rq=indexedDB.open(DB_NAME,1);
        rq.onupgradeneeded=function(){var d=rq.result;d.createObjectStore("kv");d.createObjectStore("meta");};
        rq.onsuccess=function(){res(rq.result);};
        rq.onerror=function(){res(null);};
        rq.onblocked=function(){res(null);};
      }catch(e){res(null);}
    });
    return dbp;
  }
  function idb(store,mode,fn){
    return db().then(function(d){
      if(!d)return undefined;
      return new Promise(function(res){
        try{
          var tx=d.transaction(store,mode),rq=fn(tx.objectStore(store));
          tx.oncomplete=function(){res(rq&&rq.result);};
          tx.onerror=tx.onabort=function(){res(undefined);};
        }catch(e){res(undefined);}
      });
    });
  }
  var idbGet=function(store,key){return idb(store,"readonly",function(s){return s.get(key);});};
  var idbPut=function(store,key,val){return idb(store,"readwrite",function(s){return s.put(val,key);});};
  var idbDel=function(store,key){return idb(store,"readwrite",function(s){return s.delete(key);});};
  var idbKeys=function(store){return idb(store,"readonly",function(s){return s.getAllKeys();});};

  function withTimeout(p,ms){
    return new Promise(function(res,rej){
      var t=setTimeout(function(){rej(new Error("timeout"));},ms);
      Promise.resolve(p).then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});
    });
  }
  /* Une erreur de réseau n'a pas de code Postgres ; une erreur du serveur (droits, table…) en a un : elle n'est pas « hors ligne ». */
  function isNetErr(e){
    if(!e)return false;
    if(e.name==="TypeError"||e.name==="AbortError")return true;
    var m=String(e.message||e);
    if(/fetch|network|timeout|timed out|offline|load failed|aborted|internet/i.test(m))return true;
    return !e.code&&!e.status;
  }

  window.__rtMakeBridge=function(SB){
    var state={offline:false,lastSync:null,reason:"",blocked:0};
    var probeTimer=null,syncTimer=null,syncing=false,seen={};   // seen : clés lues ou écrites avec succès pendant cette session
    var ready=Promise.all([idbGet("meta","lastSync"),idbGet("meta","lastFullSync")]).then(function(v){if(typeof v[0]==="number")state.lastSync=v[0];if(typeof v[1]==="number")state.lastFullSync=v[1];});
    function snapshot(){return {offline:state.offline,lastSync:state.lastSync,lastFullSync:state.lastFullSync||null,reason:state.reason,blocked:state.blocked};}
    function emit(){try{window.dispatchEvent(new CustomEvent("rt-net",{detail:snapshot()}));}catch(e){}}
    function touchSync(){state.lastSync=Date.now();idbPut("meta","lastSync",state.lastSync);}
    function setOffline(flag,reason){
      var changed=state.offline!==flag;
      state.offline=flag;state.reason=flag?(reason||""):"";
      if(flag&&!probeTimer)probeTimer=setInterval(probe,PROBE_EVERY);
      if(!flag&&probeTimer){clearInterval(probeTimer);probeTimer=null;}
      if(changed)emit();
      if(changed&&!flag)scheduleSync();   // la connexion revient : on récupère tout, sans attendre une action de l'utilisateur
    }
    function block(key){state.blocked++;try{window.dispatchEvent(new CustomEvent("rt-write-blocked",{detail:{key:key,blocked:state.blocked}}));}catch(e){}emit();}
    /* Teste la connexion : une lecture minimale. Réussie, elle lève l'état « hors ligne ». */
    function probe(){
      if(!SB)return Promise.resolve(false);
      if(typeof navigator!=="undefined"&&navigator.onLine===false)return Promise.resolve(false);
      return withTimeout(SB.from("kv").select("key").limit(1),READ_TIMEOUT).then(function(r){
        if(r&&r.error&&isNetErr(r.error))return false;
        setOffline(false);touchSync();return true;
      },function(){return false;});
    }
    /* Synchronisation complète du voyage ouvert : toutes ses clés sont copiées localement, même celles d'une page jamais visitée.
       Deux requêtes légères (la liste des clés, puis seulement les valeurs pas encore lues pendant cette session) ;
       ce qui a disparu du serveur est retiré de la copie. Sans effet hors ligne. */
    function scope(){
      var t="";try{t=new URLSearchParams(location.search).get("trip")||"";}catch(e){}
      return t;
    }
    async function syncTrip(){
      if(!SB||syncing||state.offline)return false;
      if(typeof navigator!=="undefined"&&navigator.onLine===false)return false;
      syncing=true;
      try{
        var trip=scope(),q=SB.from("kv").select("key");
        q=trip?q.like("key",trip+"::%"):q.not("key","like","%::%");
        var r=await withTimeout(q,READ_TIMEOUT);
        if(!r||r.error||!r.data){if(r&&r.error&&isNetErr(r.error))setOffline(true,String(r.error.message||""));return false;}
        var server=r.data.map(function(x){return x.key;}),onServer={};
        server.forEach(function(k){onServer[k]=1;});
        var inScope=function(k){return trip?k.indexOf(trip+"::")===0:k.indexOf("::")<0;};
        var cached=(await idbKeys("kv"))||[];
        for(var i=0;i<cached.length;i++){if(inScope(cached[i])&&!onServer[cached[i]])await idbDel("kv",cached[i]);}
        var missing=server.filter(function(k){return !seen[k];});
        if(missing.length){
          var r2=await withTimeout(SB.from("kv").select("key,value").in("key",missing),READ_TIMEOUT);
          if(!r2||r2.error||!r2.data){if(r2&&r2.error&&isNetErr(r2.error))setOffline(true,String(r2.error.message||""));return false;}
          for(var j=0;j<r2.data.length;j++){await idbPut("kv",r2.data[j].key,r2.data[j].value);seen[r2.data[j].key]=1;}
        }
        state.lastFullSync=Date.now();idbPut("meta","lastFullSync",state.lastFullSync);touchSync();emit();
        return true;
      }catch(e){if(isNetErr(e))setOffline(true,String(e&&e.message||e));return false;}
      finally{syncing=false;}
    }
    function scheduleSync(){
      if(syncTimer||state.offline||!SB)return;
      syncTimer=setTimeout(function(){syncTimer=null;syncTrip();},SYNC_DELAY);
    }
    /* Valeur brute (déjà décodée) d'une clé, avec repli sur la copie locale. undefined si rien. */
    async function readRaw(key){
      await ready;
      var local=await idbGet("kv",key);
      try{
        if(!SB)throw new Error("pas de client");
        if(typeof navigator!=="undefined"&&navigator.onLine===false)throw new Error("offline");
        var r=await withTimeout(SB.from("kv").select("value").eq("key",key).maybeSingle(),local!==undefined?READ_TIMEOUT:COLD_READ_TIMEOUT);
        if(r.error){
          if(isNetErr(r.error))throw r.error;
          return {found:false,error:true};       // erreur du serveur : comme avant, on renvoie « rien »
        }
        setOffline(false);
        if(!r.data){idbDel("kv",key);return {found:false};}

<script>
(function(){
  "use strict";
  var SALT="4604f021254342ca";
  var LEGACY_ADMIN_HASH="5fd2f07360cb147cb05e91882ca8294419086fa7652c5f2725b7da75aeeb6ed3";
  var LEGACY_USER_HASH="813dbd34e3a4437453a8eca44b25580f087ec3faae01650fa87e5d22615aea5a";
  var GOD_HASH="921e5ae3bb2d0b9c3a1616d1ca2c86b336653be5ca0b0550477d1e65f8d5c6da";
  var DEFAULT_ICON_SVG='<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#1c3a2e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.8-7-11a7 7 0 1 1 14 0c0 6.2-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';
  var ADMIN_ICON_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="#e2b45c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5z"/><path d="M9 12l2 2 4-4"/></svg>';

  var sb = (window.supabase && window.SUPABASE_URL) ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY) : null;

  function nsKey(tripId, base){ return tripId ? (tripId + "::" + base) : base; }

  /*PWA-KVGET*/ var __rtb = window.__rtMakeBridge ? window.__rtMakeBridge(sb) : null;
  async function kvGet(key){
    if(__rtb) return await __rtb.getValue(key);
    if(!sb) return null;
    try{
      var r = await sb.from("kv").select("value").eq("key", key).maybeSingle();
      if(r.error) return null;
      return r.data ? r.data.value : null;
    }catch(e){ return null; }
  }

  async function sha256hex(str){
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
  }

  async function getAuthHashes(tripId){
    var v = await kvGet(nsKey(tripId, "auth-hashes"));
    if(v && v.admin && v.user) return v;
    if(tripId === "") return {admin: LEGACY_ADMIN_HASH, user: LEGACY_USER_HASH};
    return null;
  }

  // Mémorise le rôle validé PAR VOYAGE : roadbook.html le relit et saute la 2e saisie
  function rememberRole(role, tripId){
    try{
      localStorage.setItem("rt_role", role);
      localStorage.setItem("rt_role::" + (tripId || ""), role);
    }catch(e){}
  }

  function showStatus(msg){
    document.getElementById("picker").style.display = "none";
    document.getElementById("err").style.display = "none";
    var st = document.getElementById("status");
    st.style.display = "block";
    st.textContent = msg;
  }

  async function redirectToRoadbook(tripId){
    showStatus("Ouverture du carnet de route…");
    var url = await kvGet(nsKey(tripId, "roadbook-url"));
    if(url && String(url).trim()){
      window.location.href = String(url).trim();
    } else {
      showStatus("Le lien de ce carnet n'est pas encore configuré. Demande à l'organisateur de le renseigner dans Admin.");
    }
  }

  async function redirectToAdmin(){
    showStatus("Ouverture de l'administration…");
    var url = await kvGet("admin-url");
    if(url && String(url).trim()){
      window.location.href = String(url).trim();
    } else {
      showStatus("L'adresse du panneau d'administration n'est pas encore configurée.");
    }
  }

  function openGate(tile){
    var picker = document.getElementById("picker");
    var name = tile.isAdmin ? "Administration" : tile.name;
    picker.innerHTML =
      '<div class="gate"><div class="gatecard">' +
        '<div class="gatename">' + escapeHtml(name) + '</div>' +
        '<div class="row"><input class="in" type="password" id="pw" placeholder="Mot de passe" autocomplete="off"' +
          (tile.isAdmin ? '' : ' inputmode="numeric" pattern="[0-9]*"') + '/>' +
        '<button class="btn" id="go">Entrer</button></div>' +
      '</div>' +
      '<button class="back" id="backBtn">← Retour</button></div>';
    document.getElementById("err").textContent = "";
    document.getElementById("pw").focus();
    document.getElementById("backBtn").addEventListener("click", renderPicker);
    document.getElementById("go").addEventListener("click", function(){ tryUnlock(tile); });
    document.getElementById("pw").addEventListener("keydown", function(e){ if(e.key==="Enter") tryUnlock(tile); });
  }

  async function tryUnlock(tile){
    var pw = document.getElementById("pw").value;
    var errEl = document.getElementById("err");
    var goBtn = document.getElementById("go");
    if(!pw) return;
    goBtn.disabled = true; errEl.textContent = "";
    try{
      var h = await sha256hex(SALT + pw);
      if(tile.isAdmin){
        if(h === GOD_HASH){ rememberRole("admin","__admin__"); await redirectToAdmin(); }
        else { errEl.textContent = "Mot de passe incorrect."; }
      } else {
        var hashes = await getAuthHashes(tile.id);
        if(hashes && (h === hashes.admin || h === hashes.user)){ rememberRole(h === hashes.admin ? "admin" : "user", tile.id); await redirectToRoadbook(tile.id); }
        else { errEl.textContent = "Mot de passe incorrect."; }
      }
    } catch(e){
      errEl.textContent = "Une erreur est survenue.";
    } finally {
      goBtn.disabled = false;
    }
  }

  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }

  var TILES = [];

  function tileHtml(tile, i){
    var img = tile.isAdmin
      ? '<div class="tileimg">' + ADMIN_ICON_SVG + '</div>'
      : (tile.logo ? '<div class="tileimg"><img src="'+tile.logo+'" alt=""/></div>' : '<div class="tileimg">'+DEFAULT_ICON_SVG+'</div>');
    return '<button type="button" class="tile'+(tile.isAdmin?' tile--admin':'')+'" data-i="'+i+'" aria-label="'+escapeHtml(tile.isAdmin?"Administration":tile.name)+'">' +
      img + '<span class="tilelabel">'+escapeHtml(tile.isAdmin?"Admin":tile.name)+'</span></button>';
  }

  function renderPicker(){
    var picker = document.getElementById("picker");
    document.getElementById("err").textContent = "";
    document.getElementById("status").style.display = "none";
    picker.style.display = "block";
    picker.innerHTML = '<div class="grid">' + TILES.map(tileHtml).join("") + '</div>';
    Array.prototype.forEach.call(picker.querySelectorAll(".tile"), function(btn){
      btn.addEventListener("click", function(){ openGate(TILES[parseInt(btn.getAttribute("data-i"),10)]); });
    });
  }

  /*PWA-KVMANY*/
  async function kvGetMany(keys){
    var out = {};
    if(__rtb){
      await Promise.all(keys.map(async function(k){ var v = await __rtb.getValue(k); if(v !== null && v !== undefined) out[k] = v; }));
      return out;
    }
    if(!sb || !keys.length) return out;
    try{
      var r = await sb.from("kv").select("key,value").in("key", keys);
      if(r.error || !r.data) return out;
      r.data.forEach(function(row){ out[row.key] = row.value; });
    }catch(e){}
    return out;
  }

  async function init(){
    var base = await kvGetMany(["roadtrip-canada-tripmeta-v1","roadtrip-canada-logo-v1","trips-index"]);
    var defaultName = base["roadtrip-canada-tripmeta-v1"];
    var defaultLogo = base["roadtrip-canada-logo-v1"];
    var idx = base["trips-index"];

    TILES.push({id:"", name:(defaultName && defaultName.name) ? defaultName.name : "Mon voyage", logo: defaultLogo || ""});

    if(idx && idx.length){
      var logoKeys = idx.map(function(t){ return nsKey(t.id, "roadtrip-canada-logo-v1"); });
      var logos = await kvGetMany(logoKeys);
      idx.forEach(function(t){
        TILES.push({id:t.id, name:t.name, logo: logos[nsKey(t.id,"roadtrip-canada-logo-v1")] || ""});
      });
    }
    TILES.push({isAdmin:true});

    renderPicker();
  }

  init();
})();
</script>
